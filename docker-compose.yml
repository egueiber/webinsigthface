services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: healthtrack-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # O backend procurará o banco pelo nome do contêiner na rede compartilhada
      DB_HOST: processadorimg-db
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASS: postgres

      FOTOS_DIR: /app/fotos
      MAPAS_DIR: /app/mapas
      VIDEOMARCACOES_DIR: /app/videomarcacoes

      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRE_HOURS: "8"
      LOGIN_MAX_TENTATIVAS: "5"
      LOGIN_JANELA_SEGUNDOS: "300"
      LOGIN_BLOQUEIO_SEGUNDOS: "300"
    volumes:
      - .:/app
      - ..\..\python\Supervisorio\fotos:/app/fotos
      - ..\..\python\Supervisorio\mapas:/app/mapas
      - ..\..\python\Supervisorio\VideoMarcacoes:/app/videomarcacoes
      - ..\..\python\Supervisorio\VideosAProcessar:/app/videosaprocessar
      - ..\..\python\Supervisorio\VideosProcessados:/app/videosprocessados
    networks:
      - healthtrack_net

# Declaração de que a rede foi criada externamente
networks:
  healthtrack_net:
    external: true